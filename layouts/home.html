{{ define "main" }}
<ul class="posts">
  {{ range .Site.RegularPages.ByDate.Reverse }}
  <li>
    <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "Jan 02" }}</time>
    <a href="{{ .RelPermalink }}">{{ .Title }}</a>
    {{ with .Description }}<p>{{ . }}</p>{{ end }}
  </li>
  {{ end }}
</ul>
{{ end }}
