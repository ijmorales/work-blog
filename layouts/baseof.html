<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} · {{ site.Title }}{{ end }}</title>
<meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ site.Params.description }}{{ end }}">
<meta name="theme-color" content="#f6f2e7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a170f" media="(prefers-color-scheme: dark)">
{{ with resources.Get "css/site.css" }}<link rel="stylesheet" href="{{ .RelPermalink }}">{{ end }}
{{ with .OutputFormats.Get "rss" }}<link rel="alternate" type="application/rss+xml" title="{{ site.Title }}" href="{{ .Permalink }}">{{ end }}
<link rel="canonical" href="{{ .Permalink }}">
</head>
<body>

<header class="site">
  <a class="wordmark" href="{{ "/" | relURL }}">{{ site.Title }}</a><span class="cursor"></span>
  {{ if .IsHome }}<p class="tagline">{{ site.Params.description }}</p>{{ end }}
</header>

<main>
{{ block "main" . }}{{ end }}
</main>

<footer class="site">
  <a href="{{ "/feed.xml" | relURL }}">RSS</a> ·
  <a href="{{ site.Params.github }}">GitHub</a>
</footer>

</body>
</html>
