server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hugo writes /posts/<slug>/index.html. Serving it for /posts/<slug>
    # directly, before nginx would 301 to add a slash, keeps the old links.
    location / {
        try_files $uri $uri/index.html $uri/ =404;
    }


    # The long form recipe lived here for a few hours today. It is a draft now,
    # so send the old link somewhere useful. Delete this if you publish it.
    location = /posts/how-to-build-software-in-this-new-era {
        return 301 /posts/how-i-build-software/;
    }

    location = /feed.xml {
        add_header Cache-Control "public, max-age=600";
    }

    location ~* \.(css|svg|png|woff2)$ {
        add_header Cache-Control "public, max-age=86400";
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
