server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Extensionless URLs: /posts/hello-world serves posts/hello-world.html
    location / {
        try_files $uri $uri.html $uri/index.html $uri/ =404;
    }

    location = /feed.xml {
        add_header Cache-Control "public, max-age=600";
    }

    location ~* \.(css|png|svg|woff2)$ {
        add_header Cache-Control "public, max-age=86400";
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
