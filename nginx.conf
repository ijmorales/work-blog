server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Behind Traefik the request arrives as http, so nginx would build its
    # redirects with that scheme and send browsers through an extra hop.
    absolute_redirect off;

    # Hugo writes /posts/<slug>/index.html. Serving it for /posts/<slug>
    # directly, before nginx would 301 to add a slash, keeps the old links.
    location / {
        try_files $uri $uri/index.html $uri/ =404;
    }


    # These three lived here for a few hours today. They are drafts now, so send
    # the old links somewhere useful. Delete a rule if you publish its post.
    location = /posts/how-to-build-software-in-this-new-era {
        return 301 /posts/how-i-build-software/;
    }

    location = /posts/you-still-have-to-think {
        return 301 /posts/how-i-build-software/;
    }

    location = /posts/hello-world {
        return 301 /;
    }

    location = /feed.xml {
        add_header Cache-Control "public, max-age=600";
    }

    location ~* \.(css|svg|png|woff2)$ {
        add_header Cache-Control "public, max-age=86400";
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
