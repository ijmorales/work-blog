amily="Cascadia, Segoe UI Emoji" font-size="10px" fill="#a9a396" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">e.g. my MCP first slice has no authorization</text></g><g transform="translate(722 206.1) rotate(0 144 6.25)"><text x="0" y="9.716796875" font-family="Cascadia, Segoe UI Emoji" font-size="10px" fill="#a9a396" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">this one means your plan has a mental model gap,</text></g><g transform="translate(722 222.1) rotate(0 87 6.25)"><text x="0" y="9.716796875" font-family="Cascadia, Segoe UI Emoji" font-size="10px" fill="#a9a396" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">so it is much harder to fight</text></g><g stroke-linecap="round"><g transform="translate(340 292) rotate(0 0 17)"><path d="M0 0 C-0.98 8.35, -0.9 17.19, 0 34 M0 0 C0.26 7.98, 0.3 17.07, 0 34" stroke="#a9a396" stroke-width="1" fill="none"/></g><g transform="translate(340 292) rotate(0 0 17)"><path d="M-5.6 17.95 C-4.95 21.73, -3.45 25.94, 0 34 M-5.6 17.95 C-3.96 21.57, -2.55 26.12, 0 34" stroke="#a9a396" stroke-width="1" fill="none"/></g><g transform="translate(340 292) rotate(0 0 17)"><path d="M6.03 18.11 C3.69 21.88, 2.2 26.05, 0 34 M6.03 18.11 C4.79 21.66, 3.34 26.17, 0 34" stroke="#a9a396" stroke-width="1" fill="none"/></g></g><mask/><g stroke-linecap="round" transform="translate(10 332) rotate(0 330 58)"><path d="M29 0 C249.45 -3.42, 468.36 -3.45, 631 0 C648.39 1.05, 656.67 12.47, 660 29 C657.21 45.77, 656.99 63.13, 660 87 C661.24 109.73, 646.86 114.68, 631 116 C480.86 119.27, 331 120.23, 29 116 C10.6 116, -1.99 104.74, 0 87 C-2.6 76.8, -2.64 62.61, 0 29 C0.7 12.69, 8.11 -0.93, 29 0" stroke="none" stroke-width="0" fill="#17281a"/><path d="M29 0 C163.16 0.59, 295.68 0.43, 631 0 M29 0 C254.77 2.32, 481.28 2.46, 631 0 M631 0 C650.73 0.02, 661.9 8.33, 660 29 M631 0 C651.6 0.78, 658.03 8.2, 660 29 M660 29 C660.39 46