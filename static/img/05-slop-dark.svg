etica, Segoe UI Emoji" font-size="13px" fill="#eceae5" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Style slop</text></g><g transform="translate(22 126.1) rotate(0 60 6.25)"><text x="0" y="9.716796875" font-family="Cascadia, Segoe UI Emoji" font-size="10px" fill="#a9a396" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">overcomplicated code</text></g><g transform="translate(22 142.1) rotate(0 51 6.25)"><text x="0" y="9.716796875" font-family="Cascadia, Segoe UI Emoji" font-size="10px" fill="#a9a396" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">abuse of comments</text></g><g transform="translate(22 158.1) rotate(0 93 6.25)"><text x="0" y="9.716796875" font-family="Cascadia, Segoe UI Emoji" font-size="10px" fill="#a9a396" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">shallow classes with no meaning</text></g><g transform="translate(22 174.1) rotate(0 90 6.25)"><text x="0" y="9.716796875" font-family="Cascadia, Segoe UI Emoji" font-size="10px" fill="#a9a396" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">tests that do not test nothing</text></g><g transform="translate(22 206.1) rotate(0 183 6.25)"><text x="0" y="9.716796875" font-family="Cascadia, Segoe UI Emoji" font-size="10px" fill="#a9a396" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">e.g. a lib/mcp/tools/fudo/base.rb AND a lib/mcp/tools/base.rb</text></g><g transform="translate(22 222.1) rotate(0 174 6.25)"><text x="0" y="9.716796875" font-family="Cascadia, Segoe UI Emoji" font-size="10px" fill="#a9a396" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">with every tool inheriting from those useless base classes</text></g><g stroke-linecap="round" transform="translate(710 92) rotate(0 330 98)"><pa