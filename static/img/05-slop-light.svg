796875" font-family="Cascadia, Segoe UI Emoji" font-size="10px" fill="#5f5847" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">e.g. my MCP first slice has no authorization</text></g><g transform="translate(722 206.1) rotate(0 144 6.25)"><text x="0" y="9.716796875" font-family="Cascadia, Segoe UI Emoji" font-size="10px" fill="#5f5847" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">this one means your plan has a mental model gap,</text></g><g transform="translate(722 222.1) rotate(0 87 6.25)"><text x="0" y="9.716796875" font-family="Cascadia, Segoe UI Emoji" font-size="10px" fill="#5f5847" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">so it is much harder to fight</text></g><g stroke-linecap="round"><g transform="translate(340 292) rotate(0 0 17)"><path d="M0 0 C0.02 13.82, -0.85 26.06, 0 34 M0 0 C-0.31 11.81, 0.25 23.14, 0 34" stroke="#5f5847" stroke-width="1" fill="none"/></g><g transform="translate(340 292) rotate(0 0 17)"><path d="M-5.73 17.99 C-3.43 24.64, -1.91 29.96, 0 34 M-5.73 17.99 C-3.98 23.61, -1.54 28.81, 0 34" stroke="#5f5847" stroke-width="1" fill="none"/></g><g transform="translate(340 292) rotate(0 0 17)"><path d="M5.9 18.06 C3.61 24.71, 0.54 30, 0 34 M5.9 18.06 C3.65 23.62, 2.09 28.8, 0 34" stroke="#5f5847" stroke-width="1" fill="none"/></g></g><mask/><g stroke-linecap="round" transform="translate(10 332) rotate(0 330 58)"><path d="M29 0 C165.2 -1.78, 300.7 -3.38, 631 0 C648.97 -2.85, 662.18 8.34, 660 29 C659.76 43.15, 660.79 63.21, 660 87 C658.06 104.68, 650.14 117.86, 631 116 C509.42 116.41, 384.74 113.99, 29 116 C6.53 119.38, -2.6 102.8, 0 87 C-2.58 63.75, -3.32 41.56, 0 29 C-0.98 7.29, 11.66 -0.63, 29 0" stroke="none" stroke-width="0" fill="#e4efe2"/><path d="M29 0 C226.59 2.81, 425.11 2.31, 631 0 M29 0 C250.36 2.23, 470.62 2.27, 631 0 M631 0 C650.62 -0.38, 661.79 9.46, 660 29 M631 0 C648.71 0.03, 660.76 10.25,