 UI Emoji" font-size="10px" fill="#5f5847" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">if you did the ramble-research-plan loop well enough,</text></g><g transform="translate(722 382.1) rotate(0 117 6.25)"><text x="0" y="9.716796875" font-family="Cascadia, Segoe UI Emoji" font-size="10px" fill="#5f5847" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">you will spot these problems right away</text></g><g transform="translate(722 398.1) rotate(0 207 6.25)"><text x="0" y="9.716796875" font-family="Cascadia, Segoe UI Emoji" font-size="10px" fill="#5f5847" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">real prompt, 14-08: "scope down the changes to only what the app has"</text></g><g transform="translate(10 484) rotate(0 400.4 8.125)"><text x="0" y="11.63525390625" font-family="Helvetica, Segoe UI Emoji" font-size="13px" fill="#1a170f" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Before opening the MR, open your IDE and read the diff as if a teammate sent it. Then ask: anything to simplify?</text></g></svg>